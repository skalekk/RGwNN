<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <title>RGwNN</title>
</head>
<body>
    <script>
    window.onload = function(){
        console.log("Retrieved:", localStorage.getItem("diff"));
        console.log("Retrieved:", localStorage.getItem("song"));
        // alert(localStorage.getItem("diff"));
        // alert(localStorage.getItem("song"));
    };
    $(function(){
        $(document).on("keydown", function(event){
            if(event.key == "d"){
                $("#b1").css("background-color", "red")
            }else if(event.key == "f"){
                $("#b2").css("background-color", "red")
            }else if(event.key == "j"){
                $("#b3").css("background-color", "red")
            }else if(event.key == "k"){
                $("#b4").css("background-color", "red")
            }
        })
        $(document).on("keyup", function(event){
            if(event.key == "d"){
                $("#b1").css("background-color", "blue")
            }else if(event.key == "f"){
                $("#b2").css("background-color", "blue")
            }else if(event.key == "j"){
                $("#b3").css("background-color", "blue")
            }else if(event.key == "k"){
                $("#b4").css("background-color", "blue")
            }
        })
    })
</script>
<style>
    .noteInput{
        background-color: blue;
    }
</style>
<div id="playArea">
    <div id="b1" class="noteInput">d</div>
    <div id="b2" class="noteInput">f</div>
    <div id="b3" class="noteInput">j</div>
    <div id="b4" class="noteInput">k</div>
</div>
</body>
</html>
