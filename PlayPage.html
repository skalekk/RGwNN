<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

</head>
<body>
    <script>
    const lanes = {
        L: {
            key: "d",
            pressed: false,
            hit: false,
            note: ".noteL",
            image: "#keyL",
            color: "#e86a73",
            position: 0
        },
        ML: {
            key: "f",
            pressed: false,
            hit: false,
            note: ".noteML",
            image: "#keyML",
            color: "#bc4a9b",
            position: 0
        },
        MR: {
            key: "j",
            pressed: false,
            hit: false,
            note: ".noteMR",
            image: "#keyMR",
            color: "#23674e",
            position: 0
        },
        R: {
            key: "k",
            pressed: false,
            hit: false,
            note: ".noteR",
            image: "#keyR",
            color: "#b9bffb",
            position: 0
        }
    }
    let volume = 1 //later change it to take a value set by a user in the choice screen
    let volumeHit = 4 //later change it to take a value set by a user in the choice screen
    let volumeHitP = 5 //later change it to take a value set by a user in the choice screen
    let songStarted
    let rythm //how fast is note going modifier
    let combo
    let missCount
    let score = 0
    let notPaused
    let chart
    let nextNote = 0
    let songStart
    let path = "songs/1/chartV.json"
    let chartFinished = false
    let activeNotes = []
    let song = localStorage.getItem("song");
    let difficulty = localStorage.getItem("diff");
    let chartPath = `songs/${song}/chart${difficulty}.json`;

        async function loadChart() {
            const response = await fetch(chartPath)
            chart = await response.json()
            
            $("#songAudio").attr("src", `songs/${song}/song.wav`);

        }

        function chartUpdate(timestamp) {
            let elapsed = timestamp - songStart
            let travelTime = (58.9 / rythm) * 1000

            while (
                nextNote < chart.notes.length &&
                chart.notes[nextNote].time - travelTime <= elapsed
            ) {
                spawnNote(chart.notes[nextNote].lane)
                nextNote++
            }

            if (nextNote >= chart.notes.length) {
                chartFinished = true
                checkGameFinished()
                return
            }

            requestAnimationFrame(chartUpdate)
        }
        function spawnNote(laneName) {
            const element = $("<div></div>")
                .addClass("note" + laneName);

            $("#spawn" + laneName).append(element);

            const note = {
                element: element,
                laneName: laneName,
                position: 0,
                hit: false
            };

            activeNotes.push(note);

            noteMove(note);
        }
        function hitCheck(laneName) {

            let target = 58.9

            let laneNotes = activeNotes.filter(note =>
                note.laneName === laneName && !note.hit
            )

            if (laneNotes.length === 0) return

            let closestNote = laneNotes.reduce((closest, note) => {
                return Math.abs(note.position - target) <
                    Math.abs(closest.position - target)
                    ? note : closest
            })

            let difference = closestNote.position - target
            let distance = Math.abs(difference)

            if (distance <= 1) {
                closestNote.hit = true
                rankMessage(1)
            } else if (distance <= 2.5) {
                closestNote.hit = true
                rankMessage(2)
            } else if (distance <= 3.5) {
                closestNote.hit = true
                rankMessage(3)
            }
        }
        function noteMove(note) {
            let lastTime = 0

            let lane = lanes[note.laneName]

            function moveNote(timestamp) {

                if (!notPaused) {
                    lastTime = 0
                    requestAnimationFrame(moveNote)
                    return
                }

                if (lastTime === 0) lastTime = timestamp

                let deltaTime = (timestamp - lastTime) / 1000
                lastTime = timestamp

                note.position += rythm * deltaTime

                $(note.element).css(
                    "transform",
                    `translateY(${note.position}vh)`
                )

                // Note was hit
                if (note.hit) {
                    removeNote(note)
                    return
                }

                // Note was missed
                if (note.position >= 60.8) {
                    rankMessage()
                    removeNote(note)
                    return
                }

                requestAnimationFrame(moveNote)
            }

            requestAnimationFrame(moveNote)
        }
        function removeNote(note) {
            note.element.remove()

            let index = activeNotes.indexOf(note)

            if (index !== -1) {
                activeNotes.splice(index, 1)
            }

            checkGameFinished()
        }
        function rankMessage(rank){
            let hitSound = document.getElementById("hitSound")
            let hitSoundP = document.getElementById("hitSound")
            switch(rank) {
                case 1:
                    score += 100
                    combo++
                    $("#scoreInfo").text("Score: " + score)
                    $("#rankInfo").text("Clean")
                    hitSoundP.currentTime = 0
                    hitSoundP.play()
                    break
                case 2:
                    score += 50
                    combo++
                    $("#scoreInfo").text("Score: " + score)
                    $("#rankInfo").text("Alright")
                    hitSound.currentTime = 0
                    hitSound.play()
                    break
                case 3:
                    score += 25
                    combo++
                    $("#scoreInfo").text("Score: " + score)
                    $("#rankInfo").text("Sluggish")
                    hitSound.currentTime = 0
                    hitSound.play()
                    break
                default:
                    combo = 0
                    missCount++
                    if(score != 0){
                        score -= 10
                        $("#scoreInfo").text("Score: " + score)
                    }
                    $("#missInfo").text("Misses: " + missCount)
                    $("#rankInfo").text("Miss")
                    break
                } 
        }
        function checkGameFinished() {
            if (chartFinished && activeNotes.length === 0) {
                console.log("Chart finished!")
                 const audio = $("#songAudio")[0];

                audio.pause();
                audio.currentTime = 0;
            }
        }
        window.onload = function(){
            console.log("Retrieved:", localStorage.getItem("diff"))
            console.log("Retrieved:", localStorage.getItem("song"))
        }
    $(function(){
        notPaused = true
        rythm = 50
        combo = 0
        missCount = 0
        $("#hitSoundP").prop("volume", (0.075 * volumeHitP));
        $("#hitSound").prop("volume", (0.075 * volumeHit));
        loadChart()
        $("#songAudio").prop("volume", 0.5);
        
        $(document).on("keydown", async function(event){
            if (!songStarted) {
                const audio = $("#songAudio")[0];

                try {
                    $("#songAudio").prop("volume", (0.075 * volume));
                    await audio.play();
                    songStarted = true;
                    songStart = performance.now();

                    requestAnimationFrame(chartUpdate);
                } catch (error) {
                    console.error("Could not start song:", error);
                }

                return;
            }

            
            
            for (const [laneName, lane] of Object.entries(lanes)) {

                if (event.key.toLowerCase() === lane.key.toLowerCase() && !lane.pressed) {

                    lane.pressed = true

                    hitCheck(laneName)

                    $(lane.image).attr(
                        "src",
                        "assets\\exported\\KeyPressed.png"
                    )

                }
            }

        })
        $(document).on("keyup", function(event){

             for (const [laneName, lane] of Object.entries(lanes)) {

                if (event.key.toLowerCase() === lane.key.toLowerCase()) {

                    lane.pressed = false

                    $(lane.image).attr(
                        "src",
                        "assets\\exported\\KeyUnpressed.png"
                    )

                }
            }

        })
    })
</script>

                </div>
                <div id="b4" class="col-3 center keyR">

                <div class="center">
