<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

    <title>RGwNN</title>
</head>
<body>
    <script>
    const lanes = {
        L: {
            key: "d",
            pressed: false,
            hit: false,
            note: ".noteL",
            image: "#keyL",
            color: "#e86a73",
            position: 0
        },
        ML: {
            key: "f",
            pressed: false,
            hit: false,
            note: ".noteML",
            image: "#keyML",
            color: "#bc4a9b",
            position: 0
        },
        MR: {
            key: "j",
            pressed: false,
            hit: false,
            note: ".noteMR",
            image: "#keyMR",
            color: "#23674e",
            position: 0
        },
        R: {
            key: "k",
            pressed: false,
            hit: false,
            note: ".noteR",
            image: "#keyR",
            color: "#b9bffb",
            position: 0
        }
    }
    let rythm //how fast is note going modifier
    let combo
    let missCount
    let score = 0
    let notPaused
    let chart;
    let nextNote = 0;
    let songStart;
    let path = "songs/1/chartV.json"

    async function loadChart() {
        const response = await fetch("songs\\1\\chartV.json");
        chart = await response.json();

        songStart = performance.now();
        requestAnimationFrame(chartUpdate);
    }

    function chartUpdate(timestamp) {
            let elapsed = timestamp - songStart;

            while (
                nextNote < chart.notes.length &&
                chart.notes[nextNote].time <= elapsed
            ) {
                spawnNote(chart.notes[nextNote].lane);
                nextNote++;
            }

            requestAnimationFrame(chartUpdate);
        }

        function spawnNote(laneName) {
        const note = document.createElement("div");

        note.classList.add("note" + laneName);

        document
            .querySelector("#spawn" + laneName)
            .appendChild(note);
    }

    function hitCheck(lane){
            //58.9vh position where the note overlaps on the "perfect"
            if (!lane || !lane.note) return

            let position = lane.position // Current note position
            let target = 58.9

            let difference = position - target
            let distance = Math.abs(difference)
            
            let timing = difference < 0 ? "early" : "late";

            if (distance <= 1) {
                lane.hit = true
                rankMessage(1)
            } else if (distance <= 2) {
                lane.hit = true
                rankMessage(2)
            } else if (distance <= 3) {
                lane.hit = true
                rankMessage(3)
            } else {
                lane.hit = false
                rankMessage()
            }
                        
        }
function noteMove(lane) {
    let howLow = 0
    let lastTime = 0
    function moveNote(timestamp) {
        if (!notPaused) {
            lastTime = 0
            requestAnimationFrame(moveNote)
            return
        }

        if (lastTime === 0) lastTime = timestamp

        let deltaTime = (timestamp - lastTime) / 1000
        lastTime = timestamp

        howLow += rythm * deltaTime
        lane.position = howLow

        $(lane.note).css("transform", `translateY(${howLow}vh)`)

        if (lane.hit) {
            howLow = 0;
            lane.position = 0;
            lane.hit = false;

            $(lane.note).css({
                "transform": "translateY(0px)",
                "background-color": lane.color
            });
        }
        // Note reaches the bottom
        if (howLow >= 60.8 && !lane.hit) {

            howLow = 0

            $(lane.note).css({
                "transform": "translateY(0px)",
                "background-color": lane.color
            })
            rankMessage()
        }

        requestAnimationFrame(moveNote)
    }

    requestAnimationFrame(moveNote)
}
    function rankMessage(rank){
        let hitSound = document.getElementById("hitSound");
        let hitSoundP = document.getElementById("hitSound");
        switch(rank) {
            case 1:
                score += 100
                combo++
                console.log("perfect")
                $("#scoreInfo").text("Score: " + score)
                $("#rankInfo").text("Clean")
                hitSoundP.currentTime = 0;
                hitSoundP.play();
                break
            case 2:
                score += 50
                combo++
                console.log("good")
                $("#scoreInfo").text("Score: " + score)
                $("#rankInfo").text("Alright")
                hitSound.currentTime = 0;
                hitSound.play();
                break
            case 3:
                score += 25
                combo++
                console.log("bad")
                $("#scoreInfo").text("Score: " + score)
                $("#rankInfo").text("Sluggish")
                hitSound.currentTime = 0;
                hitSound.play();
                break
            default:
                combo = 0
                missCount++
                if(score != 0){
                    score -= 10
                    $("#scoreInfo").text("Score: " + score)
                }
                console.log("miss")
                $("#missInfo").text("Misses: " + missCount)
                $("#rankInfo").text("Miss")
                break
            } 
    }
    window.onload = function(){
        console.log("Retrieved:", localStorage.getItem("diff"))
        console.log("Retrieved:", localStorage.getItem("song"))
    }
    $(function(){
        notPaused = true
        rythm = 50
        combo
        missCount = 0
        noteMove(lanes.L)
        // noteMove(lanes.ML)
        // noteMove(lanes.MR)
        // noteMove(lanes.R)
        loadChart();
        $(document).on("keydown", function(event){

            for (const lane of Object.values(lanes)) {

                if (event.key === lane.key && !lane.pressed) {

                    lane.pressed = true


                    hitCheck(lane)

                    console.log(hitCheck(lane))

                    $(lane.image).attr(
                        "src",
                        "assets/exported/KeyPressed.png"
                    )

                    console.log(lane.key + " pressed")
                }
            }

        })
        $(document).on("keyup", function(event){

            for (const lane of Object.values(lanes)) {

                if (event.key === lane.key) {

                    lane.pressed = false

                    $(lane.image).attr(
                        "src",
                        "assets/exported/KeyUnpressed.png"
                    )

                    console.log(lane.key + " released")
                }
            }

        })
        // $(document).on("focusout" , function(){
        //     notPaused = false
        // })
        
    })
</script>
