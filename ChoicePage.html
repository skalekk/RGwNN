<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <link rel="icon" type="image/x-icon" href="assets\exported\favicon.png" />
    <title>RGwNN</title>
</head>
<script>
    let SongInfo;
    let songChoice = 1;
    let diffChoice = 0;
    async function loadSongInfo(id) {
        let path = `songs/${id}/info.json`;

        try {
            const response = await fetch(path);

            if (!response.ok) {
                throw new Error("Couldn't load song information");
            }

            SongInfo = await response.json();

            $("#song").val(SongInfo.name);

            console.log(SongInfo);
        } catch (error) {
            console.error(error);
        }
    }
    $(function(){
        const Difficulty = ["D", "G", "B", "V"];
        var choice = 0
        $("#Difficulty").attr("value", Difficulty[choice])
        $("#previousDiff").click(function() {
            if (diffChoice > 0) {
                diffChoice--;
            }

            $("#Difficulty").val(Difficulty[diffChoice]);
        });

        $("#nextDiff").click(function() {
            if (diffChoice < Difficulty.length - 1) {
                diffChoice++;
            }

            $("#Difficulty").val(Difficulty[diffChoice]);
        });
        $("#song").attr("value", song[choice])
        $("#previousSong").click(function() {
            if (songChoice > 1) {
                songChoice--;
                loadSongInfo(songChoice);
            }
        });

        $("#nextSong").click(function() {
            songChoice++;
            loadSongInfo(songChoice);
        });

        $("form").submit(function(e){
            e.preventDefault()
        })
        $("#Play").click(function() {
            let selectedDifficulty = Difficulty[diffChoice];

            localStorage.setItem("song", songChoice);
            localStorage.setItem("diff", selectedDifficulty);

            location.href = "PlayPage.html";
        });
    })
    
</script>
<body>
<div>
    <form id="DifficultyChoice">
        <button type="button" id="previousDiff">previous</button>
        <input type="text" id="Difficulty" disabled>
        <button type="button" id="nextDiff">next</button>
    </form>
    <form id="SongChoice">
        <button type="button" id="previousSong">previous</button>
        <input type="text" id="song" disabled>
        <button type="button" id="nextSong">next</button>
    </form>
</div>
    <button id="Play">Play</button>
    <button id="return" onclick="location.href='WIPPage.html'">Settings</button>
    <button id="return" onclick="location.href='index.html'">Back</button>
</body>
</html>
